name: OLA SOCIAL CI/CD Build & Verify

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ola-social-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Verify Node & npm versions
      run: |
        node --version
        npm --version

    - name: Install dependencies
      run: npm ci

    - name: Typecheck / Lint
      run: npm run lint

    - name: Run Integrity Tests
      run: npm test

    - name: Build production bundle
      run: npm run build

    - name: Validate build artifacts
      run: |
        test -f dist/index.html
        echo "Build artifacts verified successfully in dist/"

    - name: Upload artifact for deployment
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist

  deploy:
    name: Deploy to Production
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
