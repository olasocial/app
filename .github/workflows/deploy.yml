name: OLA SOCIAL CI/CD Build & Verify

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Verify Node & npm versions
      run: |
        node --version
        npm --version

    - name: Install dependencies
      run: npm ci

    - name: Typecheck / Lint
      run: npm run lint

    - name: Build production bundle
      run: npm run build

    - name: Validate build artifacts
      run: |
        test -f dist/index.html
        echo "Build artifacts verified successfully in dist/"
